<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RentFlow — Tenant Portal</title>
  <meta name="description" content="RentFlow Tenant Portal — View invoices, pay rent and submit maintenance requests." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0b0b0a;
      --bg2:     #111110;
      --bg3:     #191918;
      --b1:      rgba(255,255,255,.07);
      --b2:      rgba(255,255,255,.12);
      --t1:      #f0ede8;
      --t2:      #b5b0a8;
      --t3:      #6b675f;
      --co:      #ff4d2e;
      --co-dim:  rgba(255,77,46,.13);
      --mint:    #4ecca3;
      --mint-d:  rgba(78,204,163,.13);
      --gold:    #f5a623;
      --gold-d:  rgba(245,166,35,.13);
      --rose:    #f56565;
      --rose-d:  rgba(245,101,101,.13);
      --r1: 8px; --r2: 14px; --r3: 20px;
      --d: 180ms ease;
    }

    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--t1); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

    /* ── TOP NAV ── */
    .portal-nav {
      position: sticky; top: 0; z-index: 50;
      background: rgba(11,11,10,.85); backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--b1);
      padding: .9rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .portal-logo { display: flex; align-items: center; gap: .6rem; font-family: 'Syne', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--t1); }
    .portal-logo i { color: var(--co); font-size: 1.1rem; }
    .portal-badge { font-size: .68rem; background: var(--co-dim); color: var(--co); border: 1px solid rgba(255,77,46,.25); border-radius: 20px; padding: .18rem .65rem; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }

    /* ── HERO LOADING ── */
    #portal-loading {
      min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    }
    #portal-loading .spin { font-size: 2.4rem; color: var(--co); animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── ERROR STATE ── */
    #portal-error { display: none; min-height: 80vh; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; text-align: center; padding: 2rem; }
    #portal-error i { font-size: 3rem; color: var(--rose); }
    #portal-error h2 { font-family: 'Syne', sans-serif; font-size: 1.5rem; }
    #portal-error p { color: var(--t2); max-width: 420px; }

    /* ── MAIN CONTENT ── */
    #portal-content { display: none; max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* ── LEASE HERO CARD ── */
    .lease-hero {
      background: linear-gradient(135deg, #1a1a18, #0f0f0e);
      border: 1px solid var(--b1); border-radius: var(--r3);
      padding: 2rem 2.2rem; margin-bottom: 2rem; position: relative; overflow: hidden;
    }
    .lease-hero::before {
      content: ''; position: absolute; top: -60px; right: -60px;
      width: 200px; height: 200px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,77,46,.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .lease-hero-top { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
    .lease-hero-title { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 700; }
    .lease-hero-sub { color: var(--t2); font-size: .88rem; margin-top: .25rem; }
    .lease-status-badge { display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .9rem; border-radius: 20px; font-size: .75rem; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
    .lease-status-badge.active   { background: var(--mint-d); color: var(--mint); border: 1px solid rgba(78,204,163,.25); }
    .lease-status-badge.inactive { background: var(--rose-d);  color: var(--rose);  border: 1px solid rgba(245,101,101,.25); }
    .lease-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1.2rem; }
    .meta-item label { font-size: .66rem; font-weight: 600; text-transform: uppercase; letter-spacing: .7px; color: var(--t3); display: block; margin-bottom: .25rem; }
    .meta-item span  { font-size: .9rem; font-weight: 500; }

    /* ── SECTION HEADER ── */
    .section-hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .section-hd h2 { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: .5rem; }
    .section-hd h2 i { color: var(--co); }

    /* ── CARDS ── */
    .card { background: var(--bg2); border: 1px solid var(--b1); border-radius: var(--r2); overflow: hidden; margin-bottom: 1.5rem; }
    .card-pad { padding: 1.4rem 1.6rem; }

    /* ── INVOICE ITEMS ── */
    .invoice-list { display: flex; flex-direction: column; gap: .6rem; padding: 1rem 1.4rem; }
    .inv-item {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: .8rem;
      padding: 1rem 1.2rem; border-radius: var(--r1);
      background: var(--bg3); border: 1px solid var(--b1);
      transition: border-color var(--d);
    }
    .inv-item:hover { border-color: var(--b2); }
    .inv-item-l { flex: 1; min-width: 120px; }
    .inv-item-month { font-weight: 600; font-size: .92rem; }
    .inv-item-sub   { font-size: .73rem; color: var(--t3); margin-top: .15rem; }
    .inv-item-r     { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
    .inv-amount     { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; }
    .badge { display: inline-block; padding: .2rem .65rem; border-radius: 20px; font-size: .68rem; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; }
    .badge-paid     { background: var(--mint-d); color: var(--mint); }
    .badge-pending  { background: var(--gold-d);  color: var(--gold); }
    .badge-overdue  { background: var(--rose-d);  color: var(--rose); }

    /* ── MAINTENANCE FORM ── */
    .maint-grid { display: grid; grid-template-columns: 1fr; gap: .85rem; padding: 1.4rem 1.6rem; }
    .fg label { font-size: .76rem; font-weight: 600; color: var(--t2); margin-bottom: .4rem; display: flex; align-items: center; gap: .35rem; }
    .fc {
      width: 100%; background: var(--bg3); border: 1px solid var(--b1);
      color: var(--t1); padding: .7rem .9rem; border-radius: var(--r1); font-family: inherit;
      font-size: .88rem; transition: border-color var(--d), box-shadow var(--d); outline: none;
    }
    .fc:focus { border-color: var(--co); box-shadow: 0 0 0 3px var(--co-dim); }
    textarea.fc { resize: vertical; min-height: 90px; }
    select.fc option { background: var(--bg3); }
    .fg-row { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
    @media(max-width:540px) { .fg-row { grid-template-columns: 1fr; } }

    /* ── MAINTENANCE ITEMS ── */
    .maint-list { display: flex; flex-direction: column; gap: .6rem; padding: 1rem 1.4rem; }
    .maint-item {
      display: flex; align-items: flex-start; gap: 1rem;
      padding: 1rem 1.2rem; border-radius: var(--r1);
      background: var(--bg3); border: 1px solid var(--b1);
    }
    .maint-icon { width: 36px; height: 36px; border-radius: var(--r1); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .maint-icon.low    { background: var(--mint-d); color: var(--mint); }
    .maint-icon.medium { background: var(--gold-d);  color: var(--gold); }
    .maint-icon.high   { background: var(--rose-d);  color: var(--rose); }
    .maint-title { font-weight: 600; font-size: .88rem; }
    .maint-desc  { font-size: .77rem; color: var(--t2); margin-top: .2rem; }
    .maint-meta  { font-size: .69rem; color: var(--t3); margin-top: .4rem; }

    /* ── BUTTONS ── */
    .btn { display: inline-flex; align-items: center; gap: .4rem; padding: .6rem 1.2rem; border-radius: var(--r1); border: none; font-family: inherit; font-size: .82rem; font-weight: 600; cursor: pointer; transition: all var(--d); }
    .btn-primary { background: var(--co); color: #fff; }
    .btn-primary:hover { background: #e83d20; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .5; cursor: default; transform: none; }
    .btn-ghost { background: transparent; color: var(--t2); border: 1px solid var(--b1); }
    .btn-ghost:hover { background: var(--b1); color: var(--t1); }
    .w100 { width: 100%; justify-content: center; }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 2.5rem 1rem; color: var(--t3); }
    .empty i { font-size: 2rem; margin-bottom: .7rem; display: block; }
    .empty p { font-size: .82rem; }

    /* ── TOAST ── */
    .toast-wrap { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; display: flex; flex-direction: column; gap: .5rem; }
    .toast { background: var(--bg3); border: 1px solid var(--b1); border-radius: var(--r1); padding: .75rem 1.1rem; display: flex; align-items: center; gap: .65rem; min-width: 240px; max-width: 340px; box-shadow: 0 8px 32px rgba(0,0,0,.4); animation: slideIn .25s ease; font-size: .82rem; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: none; opacity: 1; } }
    .toast.success .toast-ico { color: var(--mint); }
    .toast.error   .toast-ico { color: var(--rose); }
    .toast.info    .toast-ico { color: var(--gold); }
    .toast-body strong { display: block; font-size: .84rem; }
    .toast-body span   { color: var(--t2); }

    /* ── ALERT ── */
    .alert-error { background: var(--rose-d); border: 1px solid rgba(245,101,101,.25); color: var(--rose); border-radius: var(--r1); padding: .65rem .9rem; font-size: .82rem; margin-bottom: .8rem; }
    .hidden { display: none !important; }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

<!-- NAV -->
<nav class="portal-nav">
  <div class="portal-logo"><i class="fa-solid fa-building-columns"></i> RentFlow</div>
  <span class="portal-badge"><i class="fa-solid fa-user"></i> Tenant Portal</span>
</nav>

<!-- LOADING -->
<div id="portal-loading">
  <i class="fa-solid fa-circle-notch spin"></i>
  <p style="color:var(--t2)">Loading your portal…</p>
</div>

<!-- ERROR -->
<div id="portal-error">
  <i class="fa-solid fa-triangle-exclamation"></i>
  <h2>Access Denied</h2>
  <p id="portal-error-msg">This portal link is invalid or has expired. Please contact your property owner for a new link.</p>
</div>

<!-- MAIN CONTENT -->
<div id="portal-content">

  <!-- LEASE HERO -->
  <div class="lease-hero" id="lease-hero">
    <div class="lease-hero-top">
      <div>
        <div class="lease-hero-title" id="lh-title">Loading…</div>
        <div class="lease-hero-sub" id="lh-sub"></div>
      </div>
      <span class="lease-status-badge" id="lh-status"></span>
    </div>
    <div class="lease-meta">
      <div class="meta-item"><label><i class="fa-solid fa-user"></i> Tenant</label><span id="lh-tenant">—</span></div>
      <div class="meta-item"><label><i class="fa-solid fa-calendar-check"></i> Start Date</label><span id="lh-start">—</span></div>
      <div class="meta-item"><label><i class="fa-solid fa-calendar-xmark"></i> End Date</label><span id="lh-end">—</span></div>
      <div class="meta-item"><label><i class="fa-solid fa-indian-rupee-sign"></i> Monthly Rent</label><span id="lh-rent">—</span></div>
    </div>
  </div>

  <!-- INVOICES -->
  <div class="section-hd">
    <h2><i class="fa-solid fa-receipt"></i> Your Invoices</h2>
  </div>
  <div class="card" id="invoices-card">
    <div class="invoice-list" id="invoices-list">
      <div class="empty"><i class="fa-solid fa-receipt"></i><p>No invoices yet</p></div>
    </div>
  </div>

  <!-- MAINTENANCE: Submit -->
  <div class="section-hd">
    <h2><i class="fa-solid fa-screwdriver-wrench"></i> Maintenance Request</h2>
  </div>
  <div class="card" style="margin-bottom:1.5rem">
    <div class="maint-grid">
      <div id="maint-form-error" class="alert-error hidden"></div>
      <div class="fg">
        <label><i class="fa-solid fa-heading"></i> Title</label>
        <input id="maint-title" type="text" class="fc" placeholder="e.g. Leaking tap in kitchen" />
      </div>
      <div class="fg">
        <label><i class="fa-solid fa-align-left"></i> Description</label>
        <textarea id="maint-desc" class="fc" placeholder="Describe the issue in detail…"></textarea>
      </div>
      <div class="fg-row">
        <div class="fg">
          <label><i class="fa-solid fa-tag"></i> Category</label>
          <select id="maint-category" class="fc">
            <option value="PLUMBING">Plumbing</option>
            <option value="ELECTRICAL">Electrical</option>
            <option value="CARPENTRY">Carpentry</option>
            <option value="PAINTING">Painting</option>
            <option value="CLEANING">Cleaning</option>
            <option value="OTHER">Other</option>
          </select>
        </div>
        <div class="fg">
          <label><i class="fa-solid fa-circle-exclamation"></i> Priority</label>
          <select id="maint-priority" class="fc">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>
      </div>
      <button id="btn-submit-maint" class="btn btn-primary w100" onclick="submitMaintenance()">
        <i class="fa-solid fa-paper-plane"></i> Submit Request
      </button>
    </div>
  </div>

  <!-- MAINTENANCE: History -->
  <div class="section-hd">
    <h2><i class="fa-solid fa-clock-rotate-left"></i> Request History</h2>
  </div>
  <div class="card">
    <div class="maint-list" id="maint-list">
      <div class="empty"><i class="fa-solid fa-screwdriver-wrench"></i><p>No requests yet</p></div>
    </div>
  </div>

</div><!-- /portal-content -->

<div class="toast-wrap" id="toast-container"></div>

<script>
'use strict';

const API = '/api';
let TOKEN = '';

// ── GET TOKEN FROM URL ──
function getToken() {
  const p = new URLSearchParams(window.location.search);
  return p.get('token') || '';
}

// ── FETCH HELPERS ──
async function get(path) {
  const r = await fetch(API + path);
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.message || `Error ${r.status}`); }
  return r.json();
}
async function post(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.message || b || `Error ${r.status}`); }
  return r.json().catch(() => null);
}

// ── FORMAT HELPERS ──
function fmtDate(d) { if (!d) return '—'; try { return new Date(d).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' }); } catch { return d; } }
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── TOAST ──
function toast(type, title, msg) {
  const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fa-solid ${icons[type]||'fa-circle-info'} toast-ico"></i><div class="toast-body"><strong>${esc(title)}</strong><span>${esc(msg)}</span></div>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── RENDER LEASE HERO ──
function renderLease(lease) {
  const unit = lease.unit || {};
  const tenant = lease.tenant || {};
  const prop = unit.property || {};

  document.getElementById('lh-title').textContent = `Unit ${unit.unitNumber || '—'} — ${prop.name || '—'}`;
  document.getElementById('lh-sub').textContent   = prop.address || '';
  document.getElementById('lh-tenant').textContent = tenant.fullName || '—';
  document.getElementById('lh-start').textContent  = fmtDate(lease.startDate);
  document.getElementById('lh-end').textContent    = fmtDate(lease.endDate) || 'Open-ended';
  document.getElementById('lh-rent').textContent   = unit.baseRent ? `₹${unit.baseRent.toLocaleString('en-IN')}/mo` : '—';

  const statusEl = document.getElementById('lh-status');
  if (lease.isActive) {
    statusEl.textContent = '● Active';
    statusEl.className   = 'lease-status-badge active';
  } else {
    statusEl.textContent = '● Inactive';
    statusEl.className   = 'lease-status-badge inactive';
  }
}

// ── RENDER INVOICES ──
function renderInvoices(invoices) {
  const list = document.getElementById('invoices-list');
  if (!invoices || invoices.length === 0) {
    list.innerHTML = `<div class="empty"><i class="fa-solid fa-receipt"></i><p>No invoices generated yet</p></div>`;
    return;
  }
  list.innerHTML = '';
  invoices.sort((a, b) => (b.id || 0) - (a.id || 0)).forEach(inv => {
    const status = (inv.status || 'PENDING').toUpperCase();
    const badgeCls = status === 'PAID' ? 'badge-paid' : status === 'OVERDUE' ? 'badge-overdue' : 'badge-pending';
    list.insertAdjacentHTML('beforeend', `
      <div class="inv-item">
        <div class="inv-item-l">
          <div class="inv-item-month">${esc(inv.billingMonth || '—')}</div>
          <div class="inv-item-sub">Rent ₹${(inv.rentAmount||0).toFixed(2)} · Electricity ₹${(inv.electricityAmount||0).toFixed(2)} · Due ${fmtDate(inv.dueDate)}</div>
        </div>
        <div class="inv-item-r">
          <span class="inv-amount">₹${(inv.totalAmount||0).toLocaleString('en-IN',{minimumFractionDigits:2})}</span>
          <span class="badge ${badgeCls}">${status}</span>
          ${(status === 'PENDING' || status === 'OVERDUE') 
            ? `<button class="btn btn-primary btn-sm" style="padding:.4rem .8rem" onclick="payInvoice(${inv.id}, this)">Pay Now</button>` 
            : ''}
        </div>
      </div>`);
  });
}

// ── RENDER MAINTENANCE HISTORY ──
function renderMaintenance(requests) {
  const list = document.getElementById('maint-list');
  if (!requests || requests.length === 0) {
    list.innerHTML = `<div class="empty"><i class="fa-solid fa-screwdriver-wrench"></i><p>No requests submitted yet</p></div>`;
    return;
  }
  list.innerHTML = '';
  const statusColors = { PENDING: '#f5a623', IN_PROGRESS: '#4ecca3', RESOLVED: '#4ecca3', CLOSED: '#6b675f' };
  requests.sort((a, b) => (b.id || 0) - (a.id || 0)).forEach(r => {
    const pri = (r.priority || 'LOW').toLowerCase();
    const priIcons = { low: 'fa-arrow-down', medium: 'fa-minus', high: 'fa-arrow-up' };
    const statusColor = statusColors[(r.status || 'PENDING').toUpperCase()] || '#6b675f';
    list.insertAdjacentHTML('beforeend', `
      <div class="maint-item">
        <div class="maint-icon ${pri}"><i class="fa-solid ${priIcons[pri]||'fa-minus'}"></i></div>
        <div style="flex:1">
          <div class="maint-title">${esc(r.title||'—')}</div>
          <div class="maint-desc">${esc(r.description||'')}</div>
          <div class="maint-meta">
            ${esc(r.category||'')} ·
            <span style="color:${statusColor}">${esc(r.status||'PENDING')}</span> ·
            ${fmtDate(r.createdAt)}
          </div>
        </div>
      </div>`);
  });
}

// ── SUBMIT MAINTENANCE ──
async function submitMaintenance() {
  const title    = document.getElementById('maint-title').value.trim();
  const desc     = document.getElementById('maint-desc').value.trim();
  const category = document.getElementById('maint-category').value;
  const priority = document.getElementById('maint-priority').value;
  const errEl    = document.getElementById('maint-form-error');
  const btn      = document.getElementById('btn-submit-maint');

  if (!title) { errEl.textContent = '⚠ Please enter a title.'; errEl.classList.remove('hidden'); return; }
  errEl.classList.add('hidden');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Submitting…';
  try {
    await post(`/leases/verify/${TOKEN}/maintenance`, { title, description: desc, category, priority });
    document.getElementById('maint-title').value = '';
    document.getElementById('maint-desc').value  = '';
    toast('success', 'Request Submitted', 'Your maintenance request has been sent.');
    // Reload maintenance list
    const reqs = await get(`/leases/verify/${TOKEN}/maintenance`).catch(() => []);
    renderMaintenance(reqs);
  } catch (err) {
    errEl.textContent = '⚠ ' + err.message;
    errEl.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Request';
  }
}

// ── BOOTSTRAP ──
async function init() {
  TOKEN = getToken();
  if (!TOKEN) {
    document.getElementById('portal-loading').style.display = 'none';
    document.getElementById('portal-error').style.display = 'flex';
    document.getElementById('portal-error-msg').textContent = 'No access token found in the URL. Please use the full link shared by your property owner.';
    return;
  }

  try {
    const [lease, invoices, maintenance] = await Promise.all([
      get(`/leases/verify/${TOKEN}`),
      get(`/leases/verify/${TOKEN}/invoices`).catch(() => []),
      get(`/leases/verify/${TOKEN}/maintenance`).catch(() => []),
    ]);

    renderLease(lease);
    renderInvoices(invoices);
    renderMaintenance(maintenance);

    document.getElementById('portal-loading').style.display = 'none';
    document.getElementById('portal-content').style.display = 'block';
  } catch (err) {
    document.getElementById('portal-loading').style.display = 'none';
    const errDiv = document.getElementById('portal-error');
    errDiv.style.display = 'flex';
    document.getElementById('portal-error-msg').textContent = err.message || 'Invalid or expired portal link.';
  }
}

window.submitMaintenance = submitMaintenance;
window.payInvoice = async function(invoiceId, btn) {
  const origHtml = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
  
  try {
    const orderData = await post(`/tenant/portal/pay/${TOKEN}?invoiceId=${invoiceId}`, {});
    if (!orderData || !orderData.orderId) throw new Error("Failed to create order");
    
    const rzpOrderId = orderData.orderId;
    
    if (rzpOrderId.startsWith('order_mock_')) {
      toast('info', 'Mock Payment', 'Simulating payment success...');
      setTimeout(async () => {
        try {
          await post(`/tenant/portal/verify-payment/${TOKEN}`, {
            razorpay_order_id: rzpOrderId,
            razorpay_payment_id: 'pay_mock_' + Math.random().toString(36).substring(7),
            razorpay_signature: 'mock_signature'
          });
          toast('success', 'Payment Successful', 'Invoice has been marked as paid.');
          init();
        } catch(e) {
          toast('error', 'Verification Failed', e.message);
          btn.disabled = false; btn.innerHTML = origHtml;
        }
      }, 1500);
      return;
    }
    
    const options = {
      key: orderData.key || 'rzp_test_placeholder',
      amount: orderData.amount,
      currency: orderData.currency,
      name: "RentFlow Properties",
      description: "Invoice Payment",
      order_id: rzpOrderId,
      handler: async function (response) {
        toast('info', 'Processing', 'Verifying payment...');
        try {
          await post(`/tenant/portal/verify-payment/${TOKEN}`, {
            razorpay_order_id: response.razorpay_order_id,
            razorpay_payment_id: response.razorpay_payment_id,
            razorpay_signature: response.razorpay_signature
          });
          toast('success', 'Payment Successful', 'Invoice has been marked as paid.');
          init();
        } catch(e) {
          toast('error', 'Verification Failed', e.message);
          btn.disabled = false; btn.innerHTML = origHtml;
        }
      },
      prefill: {
        name: document.getElementById('lh-tenant').textContent,
        email: "tenant@example.com"
      },
      theme: { color: "#ff4d2e" }
    };
    const rzp = new Razorpay(options);
    rzp.on('payment.failed', function (response){
      toast('error', 'Payment Failed', response.error.description);
      btn.disabled = false; btn.innerHTML = origHtml;
    });
    rzp.open();
  } catch(err) {
    toast('error', 'Payment Error', err.message);
    btn.disabled = false; btn.innerHTML = origHtml;
  }
};

document.addEventListener('DOMContentLoaded', init);
</script>
